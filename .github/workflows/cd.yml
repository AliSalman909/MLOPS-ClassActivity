name: Continuous Delivery
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Building version ${{ steps.version.outputs.version }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${GITHUB_REPOSITORY,,}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.version.outputs.version }}
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest

  deploy-staging:
    needs: build
    runs-on: [self-hosted, Windows, X64, mlops-local]
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      DOCKER_CONFIG: ${{ runner.temp }}/docker-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Login to GHCR for deployment
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy staging on Docker Desktop
        # -File avoids quoting problems with the apostrophe in the Windows user path.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant()):$env:RELEASE_VERSION"
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Could not pull the staging image.' }

          $existing = docker ps -a --filter 'name=^/mlops-staging$' --format '{{.Names}}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list containers.' }
          if ($existing -contains 'mlops-staging') {
            docker stop mlops-staging
            if ($LASTEXITCODE -ne 0) { throw 'Could not stop staging.' }
            docker rm mlops-staging
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the old staging container.' }
          }

          docker run -d --name mlops-staging --restart unless-stopped -p 127.0.0.1:5001:5000 $image
          if ($LASTEXITCODE -ne 0) { throw 'Could not start staging.' }

      - name: Verify staging deployment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $healthUrl = 'http://127.0.0.1:5001/health'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
              $health = $response.Content | ConvertFrom-Json
              if ($response.StatusCode -ne 200 -or $health.status -ne 'healthy') {
                throw 'The API did not report a healthy status.'
              }
              Write-Output "Staging passed its health check: $($response.Content)"
              exit 0
            } catch {
              Write-Output "Health check attempt $attempt of 12 failed: $($_.Exception.Message)"
              if ($attempt -lt 12) { Start-Sleep -Seconds 5 }
            }
          }
          throw 'Staging failed its health check after 12 attempts.'

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: [self-hosted, Windows, X64, mlops-local]
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      DOCKER_CONFIG: ${{ runner.temp }}/docker-production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Login to GHCR for production
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production on Docker Desktop
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant()):$env:RELEASE_VERSION"
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Could not pull the production image.' }

          $existing = docker ps -a --filter 'name=^/mlops-production$' --format '{{.Names}}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list containers.' }
          if ($existing -contains 'mlops-production') {
            docker stop mlops-production
            if ($LASTEXITCODE -ne 0) { throw 'Could not stop production.' }
            docker rm mlops-production
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the old production container.' }
          }

          docker run -d --name mlops-production --restart unless-stopped -p 127.0.0.1:5002:5000 $image
          if ($LASTEXITCODE -ne 0) { throw 'Could not start production.' }
